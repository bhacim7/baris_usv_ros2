services:
  usv:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: usv-ros2:dev
    container_name: usv
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - ROS_DOMAIN_ID=7
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ws:/ws
      - gz_cache:/home/ubuntu/.gz
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  gz_cache:
