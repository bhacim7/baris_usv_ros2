# sim_bridge: the simulated flight-controller side of the boat. Every number here describes
# real hardware and is meant to be replaced by a measurement when one exists.
# Lists must stay floats (1100.0, not 1100): ROS parameters are typed.
sim_bridge:
  ros__parameters:
    output_rate_hz: 50.0

    # fc_bridge design (ARCHITECTURE.md, safety): no ThrusterPwm for this long -> 1500
    command_timeout_s: 0.5

    # Motor power relay at start. On the boat this is ArduPilot's RELAY_DEFAULT
    # (parameter file not seen yet); on here so the boat can be driven straight away.
    relay_on_at_start: true

    # Legacy USVController.set_servo write thinning (config.py)
    min_pwm_delta_us: 3          # SERVO_MIN_PWM_DELTA
    servo_refresh_s: 0.5         # SERVO_REFRESH_S

    # ESC + Degz Utras on 7S: PWM (us) -> thrust (N). ASSUMED linear from the datasheet:
    # 91 N forward at 1900, reverse 70 % = -64 N at 1100, no ESC dead band.
    # Replace with the bollard pull test (scale reading in kgf x 9.81 = N per PWM step).
    thrust_table_pwm:    [1100.0, 1500.0, 1900.0]
    thrust_table_newton: [-64.0,  0.0,    91.0]

    # Steering: one PWM channel, two MG995 servos (one per front thruster).
    # Team: 1100 = 45 deg left, 1900 = 45 deg right (to be measured on the boat).
    steer_center_us: 1500.0
    steer_half_range_us: 400.0
    steer_max_angle_rad: 0.785
    steer_sign: -1.0             # PWM > 1500 = boat turns right = negative Gazebo angle
    # MG995 datasheet: 0.20 s / 60 deg at 4.8 V (0.16 s at 6 V), no load = 5.2-6.5 rad/s.
    # The lower figure, since the servo turns a thruster in water.
    steer_rate_rad_s: 5.2

    # ---------------------------------------------------------------- sensors
    # Noise: 0 = different every run, any other number = the same noise every run
    random_seed: 0

    # /usv/fix: GPS_RAW_INT from the Orange Cube, Here Pro WITHOUT RTK.
    # The legacy code asks for every stream at 5 Hz, but in the 2026-10-14 video the
    # position changed only every 12-17 frames (2-2.5 Hz). ArduPilot .param not seen yet.
    fix_rate_hz: 2.0
    fix_delay_s: 0.1             # ASSUMED receiver + MAVLink latency
    # Error = slow drift + jitter. ASSUMED for a non-RTK receiver: ~1 m that wanders over
    # a minute; in the video the track was smooth to ~0.2 m over 1-2 s.
    gps_bias_sigma_m: 1.0
    gps_bias_tau_s: 60.0
    gps_white_sigma_m: 0.15

    # /usv/speed: VFR_HUD ground speed (EKF, from GPS velocity), ALL stream at 5 Hz.
    # The HUD under-read seen in the video is NOT copied until its cause is known.
    speed_rate_hz: 5.0
    speed_sigma_mps: 0.05        # ASSUMED, typical GPS Doppler velocity noise

    # /usv/heading/fc: GLOBAL_POSITION_INT.hdg (EKF heading, Cube compass), 5 Hz
    heading_fc_rate_hz: 5.0
    heading_fc_offset_deg: 0.0   # constant compass error; unknown for the Cube
    heading_fc_sigma_deg: 1.0    # ASSUMED
