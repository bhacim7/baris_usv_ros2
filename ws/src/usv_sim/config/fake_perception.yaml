# fake_perception: the simulated ZED 2i. Every number describes the real camera and is to be
# replaced by a measurement when one exists.
fake_perception:
  ros__parameters:
    # 0 = different noise every run, any other number = the same noise every run
    random_seed: 0

    # Course file (usv_sim/courses/<name>.yaml): the Earth's field at the site, and the
    # buoys. Use the same course the Gazebo world was generated from.
    course: golcuk_2026_10_14

    # ---------------------------------------------------------------- heading
    # Added after the filter, as camera_process does (+6 Istanbul; RoboBoat USA used -6).
    # Equal to the course's magnetic_field.declination_deg = a correct compass.
    magnetic_declination_deg: 6.0
    magnetometer_noise_deg: 1.0          # ASSUMED, per frame, before the legacy filter
    # Compass error. The 2026-10-14 video suggests the ZED read ~4 deg (heading ~145) to
    # ~8.5 deg (heading ~165) too high: uncertain, so 0 until measured on the boat.
    #   compass_offset_deg: the same error at every heading
    #   hard_iron_body_uT:  a field fixed to the boat (x forward, y left, z up); gives an
    #                       error that changes with heading, like a badly calibrated compass
    compass_offset_deg: 0.0
    hard_iron_body_uT: [0.0, 0.0, 0.0]

    # ---------------------------------------------------------------- frame rate
    # HD720 at 30 fps; the video's FPS counter dropped to 13-19 now and then
    fps_normal: 30.0
    fps_slow: 15.0
    fps_normal_mean_s: 20.0              # mean length of a normal spell (0 = never slow)
    fps_slow_mean_s: 2.0                 # mean length of a slow spell

    # ---------------------------------------------------------------- camera (ZED 2i, HD720)
    image_width: 1280
    image_height: 720
    camera_hfov_deg: 110.0               # config.py CAM_HFOV (the boat uses factory fx)
    # Left lens (the ZED reports the left image), body frame x fwd / y left / z up.
    # 0.29 m ahead of the hull centre, 0.18 m above water, level (team, 2026-10-30).
    camera_mount_m: [0.29, 0.06, 0.18]
    # Must match the navsat sensor in models/usv_boat/model.sdf (true boat pose from it)
    gnss_antenna_mount_m: [-0.60, 0.0, 0.75]

    # ---------------------------------------------------------------- YOLO, ASSUMED
    max_range_m: 20.0                    # the video showed detections out to ~14 m
    min_box_px: 4.0
    full_detection_px: 25.0              # shorter boxes are found less often
    detect_prob: 0.98
    box_jitter_px: 2.0
    class_confusion: 0.02                # the video once labelled an orange buoy "Yellow"
    occlusion_fraction: 0.6

    # ---------------------------------------------------------------- ZED depth
    depth_error_coeff: 0.0033            # sigma = coeff * d^2 (datasheet: 1 % @ 3 m, 5 % @ 15 m)
    depth_pixel_noise: 0.005             # per pixel, share of the depth
    depth_nan_prob: 0.10                 # water reflections: pixels without depth
