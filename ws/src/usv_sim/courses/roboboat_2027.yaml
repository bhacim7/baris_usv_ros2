# RoboBoat 2027 course at Nathan Benderson Park: one map for two things.
#
#   readiness     the 2026 Task 1 (entry/exit gates) and Task 2 (channel + debris field),
#                 kept for the Proof of Readiness video. Built from the 2026 Team Handbook,
#                 section 3.2; the run that works today (phase 6 R3).
#   competition   the 2027 course. NOT PLACED YET: Baris picks its place in Gazebo, the
#                 elements come with roadmap step 4 (docs/roboboat-2027.md, section 8).
#
# Until 2026-11-10 this file was roboboat_2026.yaml and also held the 2026 Task 3-6 elements
# (speed gate, yellow buoys, docks, vessels). That full course is in git history
# (commit 4cf5496) and, for the dock and vessel tests, in test/data/roboboat_2026_full.yaml.
#
# Element sizes are the 2026 handbook's (see usv_sim/course.py). The LAYOUT is ASSUMED: the
# handbook gives a sketch, not coordinates. Distances it does give are kept: channel gates
# 6-10 ft wide (2.5 m used), start at least 6 ft before the first Task 1 gate (8 m used).
# Positions are east/north metres, drawn heading north; `placement` turns it in the park.
#
# What a readiness run should find:
#   Task 1  two pole gates heading north, red on the port (west) side
#   Task 2  four channel gates north of Task 1, debris field beyond: five black buoys,
#           one GREEN indicator (circle it) and one RED indicator (avoid it), a black vessel

name: roboboat_2027
classes: roboboat

# VRX nbpark world origin (Nathan Benderson Park, Sarasota, Florida). The park's land model
# stays in the world (venue), so the reported lat/lon are the real park's.
origin: {lat: 27.367256, lon: -82.451120}
venue: nbpark
# Where the course sits in the park: the named start is at (east, north) of the Gazebo
# world, pointing heading_deg (compass), and the whole layout below follows it. Chosen by
# Baris in Gazebo (2026-11-01): the readiness start at (-189.17, 947.45), heading west.
# To try another place without editing this file (the start in use is put there):
#   ros2 launch usv_sim sim.launch.py course:=roboboat_2027 course_east:=.. course_north:=.. course_heading:=..
# Place boxes from a TOP view only: Gazebo's water plane runs on under the land, and the
# land is invisible from below.
placement: {start: readiness, east: -189.17, north: 947.45, heading_deg: 270.0}

# Declination -6 deg as the team used in 2026 (legacy notes); inclination and strength are
# rounded WMM values for Sarasota (ASSUMED)
magnetic_field: {declination_deg: -6.0, inclination_deg: 55.5, strength_uT: 45.5}

# Where the boat starts: sim.launch.py start:=<name>. `competition` joins when the 2027
# course is placed, and becomes the default then.
starts:
  readiness: {east: 2.0, north: -8.0, heading_deg: 0.0}    # 8 m before the first Task 1 gate

# Navigator settings per mission: sim.launch.py mission:=<name> passes them on
# (competition: roboboat follows from `classes`). `roboboat_2027` joins with the mission
# manager (roadmap step 6). The hints are what a team member on the shore would give:
# "ahead_m,left_m" from the centre of the first Task 1 gate, ahead = towards the second gate
# (here north). Worked out from the layout below, so they are exact; on the water they are
# a guess, and the boat must find the task itself either way.
missions:
  readiness:
    roboboat.task_order: [task2]
    roboboat.hint.task2: '21.1,-1.5'          # first channel gate

default: {start: readiness, mission: readiness}

buoy_types:
  # Task 1: Taylor Made Sur-Mark, 18 in wide, 39 in above the water
  pole_red:        {class: pole_red,        shape: pole,      diameter: 0.457, height: 0.99,  color: red}
  pole_green:      {class: pole_green,      shape: pole,      diameter: 0.457, height: 0.99,  color: green}
  # Task 2: Polyform A-0, 20.3 cm, 0.5 ft above the water
  a0_red:          {class: buoy_red,        shape: sphere,    diameter: 0.203, height: 0.152, color: red}
  a0_green:        {class: buoy_green,      shape: sphere,    diameter: 0.203, height: 0.152, color: green}
  a0_black:        {class: buoy_black,      shape: sphere,    diameter: 0.203, height: 0.152, color: black}
  # Color indicator: cylinder on an 18 in float frame, 1 ft above the water
  indicator_red:   {class: indicator_red,   shape: indicator, diameter: 0.457, height: 0.305, color: red}
  indicator_green: {class: indicator_green, shape: indicator, diameter: 0.457, height: 0.305, color: green}

buoys:
  # --- Task 1: entry/exit gates, 8.7 m wide and 8.0 m apart as placed in Gazebo ---
  - {type: pole_red,   east: -2.28, north: 0.0}
  - {type: pole_green, east: 6.38,  north: 0.0}
  - {type: pole_red,   east: -2.28, north: 7.95}
  - {type: pole_green, east: 6.38,  north: 7.95}
  # --- Task 2: navigation channel, red on the port side going in; first gate where Baris
  #     placed the Task 2 entrance ---
  - {type: a0_red,     east: 2.32, north: 21.13}
  - {type: a0_green,   east: 4.82, north: 21.13}
  - {type: a0_red,     east: 2.92, north: 27.13}
  - {type: a0_green,   east: 5.42, north: 27.13}
  - {type: a0_red,     east: 3.52, north: 33.13}
  - {type: a0_green,   east: 6.02, north: 33.13}
  - {type: a0_black,   east: 4.12, north: 33.33}   # inside the gate, beside the red
  - {type: a0_red,     east: 4.52, north: 39.13}
  - {type: a0_green,   east: 7.02, north: 39.13}
  - {type: a0_black,   east: 5.12, north: 39.43}
  # --- Task 2: debris field ---
  - {type: a0_black,   east: 7.52,  north: 45.13}
  - {type: a0_black,   east: 12.52, north: 47.13}
  - {type: a0_black,   east: 16.52, north: 52.13}
  - {type: a0_black,   east: 20.52, north: 55.13}
  - {type: a0_black,   east: 9.52,  north: 54.13}
  - {type: indicator_green, east: 14.52, north: 49.13}   # survivor: circle 360 and report
  - {type: indicator_red,   east: 18.52, north: 58.13}   # hazard: avoid and report

vessels:
  - {color: black,  east: 6.52, north: 56.13, heading_deg: 30.0}  # in the debris field

# Map-measurement route (phase 6 R1.6), driven by survey_drive from Gazebo's true pose, so
# every run takes the same path: through the Task 1 gates, one full turn on the spot (the
# heading filter's lag), the channel just right of its centre line, across the debris field,
# then back south along the east side of the channel to the start. About 130 m. Same
# coordinates as the buoys. (Until 2026-11-10 the route went on through the Task 3 gate and
# past the marina, about 155 m: numbers of older survey runs are not comparable.)
survey:
  - {east: 2.05, north: -1.0}
  - {east: 2.05, north: 11.0}
  - {spin_deg: 360}
  - {east: 3.6,  north: 18.0}
  - {east: 4.5,  north: 27.1}
  - {east: 5.1,  north: 33.1}
  - {east: 6.1,  north: 39.1}
  - {east: 5.5,  north: 45.5}
  - {east: 11.5, north: 52.0}
  - {east: 17.5, north: 49.5}
  - {east: 14.0, north: 40.0}
  - {east: 11.0, north: 25.0}
  - {east: 9.5,  north: 10.0}
  - {east: 8.0,  north: -3.0}
  - {east: 2.0,  north: -6.0}
