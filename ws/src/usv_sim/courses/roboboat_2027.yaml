# RoboBoat 2027 course at Nathan Benderson Park: one map for two things.
#
#   readiness     the 2026 Task 1 (entry/exit gates) and Task 2 (channel + debris field),
#                 kept for the Proof of Readiness video. Built from the 2026 Team Handbook,
#                 section 3.2; the run that works today (phase 6 R3).
#   competition   the 2027 course, about 137 m south of the readiness start in the park
#                 (start chosen by Baris in Gazebo, 2026-11-10), laid out as the
#                 Primer's course layout picture: Task 1-5 (see below).
#
# Until 2026-11-10 this file was roboboat_2026.yaml and also held the 2026 Task 3-6 elements
# (speed gate, yellow buoys, docks, vessels). That full course is in git history
# (commit 4cf5496) and, for the dock and vessel tests, in test/data/roboboat_2026_full.yaml.
#
# Element sizes are the 2026 handbook's (see usv_sim/course.py). The LAYOUT is ASSUMED: the
# handbook gives a sketch, not coordinates. Distances it does give are kept: channel gates
# 6-10 ft wide (2.5 m used), start at least 6 ft before the first Task 1 gate (8 m used).
# Positions are east/north metres, drawn heading north; `placement` turns it in the park.
#
# What a readiness run should find:
#   Task 1  two pole gates heading north, red on the port (west) side
#   Task 2  four channel gates north of Task 1, debris field beyond: five black buoys,
#           one GREEN indicator (circle it) and one RED indicator (avoid it), a black vessel

name: roboboat_2027
classes: roboboat

# Where the Gazebo world's (0, 0) is on the earth (Nathan Benderson Park, Sarasota, Florida).
# The park's land model stays in the world (venue). VRX's own origin for it (27.367256,
# -82.451120) put the model 76 m north and 35 m west of the real park: measured 2026-11-11
# by Baris against the GCS's satellite map (the peninsula's south-west corner, Gazebo
# (-166.24, 678.83); the boat 38 m west of it showed 105 m at 316 deg from the corner on the
# map). Corrected here, so the simulated GPS reads the real park's lat/lon. One point was
# measured: an offset, not a scale or rotation check. Bags recorded before this carry the
# old origin: report them with a course file that has it (git show 063587e:<this file>).
origin: {lat: 27.366566, lon: -82.450768}
venue: nbpark
# Where the course sits in the park: the named start is at (east, north) of the Gazebo
# world, pointing heading_deg (compass), and the whole layout below follows it. Chosen by
# Baris in Gazebo (2026-11-01): the readiness start at (-189.17, 947.45), heading west.
# To try another place without editing this file (the start in use is put there):
#   ros2 launch usv_sim sim.launch.py course:=roboboat_2027 course_east:=.. course_north:=.. course_heading:=..
# Place boxes from a TOP view only: Gazebo's water plane runs on under the land, and the
# land is invisible from below.
placement: {start: readiness, east: -189.17, north: 947.45, heading_deg: 270.0}

# Declination -6 deg as the team used in 2026 (legacy notes); inclination and strength are
# rounded WMM values for Sarasota (ASSUMED)
magnetic_field: {declination_deg: -6.0, inclination_deg: 55.5, strength_uT: 45.5}

# Where the boat starts: sim.launch.py start:=<name>. Same frame as the buoys (drawn heading
# north; the placement turns it to head west in the park).
#   competition  Gazebo (-197.80, 809.98), heading west like the readiness course (Baris,
#                2026-11-10). The 2027 elements will be drawn ahead of it (north here);
#                the default becomes competition when they are there (step 4).
starts:
  readiness:   {east: 2.0,     north: -8.0, heading_deg: 0.0}  # 8 m before the first Task 1 gate
  competition: {east: -135.47, north: 0.63, heading_deg: 0.0}

# Navigator settings per mission: sim.launch.py mission:=<name> passes them on
# (competition: roboboat follows from `classes`). `roboboat_2027` joins with the mission
# manager (roadmap step 6). The hints are what a team member on the shore would give:
# "ahead_m,left_m" from the centre of the first Task 1 gate, ahead = towards the second gate
# (here north). Worked out from the layout below, so they are exact; on the water they are
# a guess, and the boat must find the task itself either way.
missions:
  readiness:
    roboboat.mission: readiness
    roboboat.task_order: [task2]
    roboboat.hint.task2: '21.1,-1.5'          # first channel gate
  # The 2027 competition: the mission manager (usv_core/mission.py). Tasks not written yet
  # are skipped ("not written yet"); requests come from RoboCommand through the GCS
  roboboat_2027:
    roboboat.mission: roboboat_2027
    roboboat.plan: [task1, marina, task5, task2]

default: {start: readiness, mission: readiness}

buoy_types:
  # Task 1: Taylor Made Sur-Mark, 18 in wide, 39 in above the water
  pole_red:        {class: pole_red,        shape: pole,      diameter: 0.457, height: 0.99,  color: red}
  pole_green:      {class: pole_green,      shape: pole,      diameter: 0.457, height: 0.99,  color: green}
  # Task 2: Polyform A-0, 20.3 cm, 0.5 ft above the water
  a0_red:          {class: buoy_red,        shape: sphere,    diameter: 0.203, height: 0.152, color: red}
  a0_green:        {class: buoy_green,      shape: sphere,    diameter: 0.203, height: 0.152, color: green}
  a0_black:        {class: buoy_black,      shape: sphere,    diameter: 0.203, height: 0.152, color: black}
  # Color indicator: cylinder on an 18 in float frame, 1 ft above the water
  indicator_red:   {class: indicator_red,   shape: indicator, diameter: 0.457, height: 0.305, color: red}
  indicator_green: {class: indicator_green, shape: indicator, diameter: 0.457, height: 0.305, color: green}
  # 2027: RoboBuoy with a Light Beacon (usv_sim/robobuoy.py); its class follows the light
  robobuoy:        {shape: robobuoy, symbol: diamond}
  robobuoy_number: {shape: robobuoy, symbol: digit, top: indicator}   # Task 2, numbered
  robobuoy_marker: {shape: robobuoy, symbol: letter, top: none}       # course corners
  # 2027 Task 2: Polyform A-2 (ASSUMED size) in six colours
  a2_red:          {class: buoy_red,        shape: sphere,    diameter: 0.368, height: 0.305, color: red}
  a2_green:        {class: buoy_green,      shape: sphere,    diameter: 0.368, height: 0.305, color: green}
  a2_black:        {class: buoy_black,      shape: sphere,    diameter: 0.368, height: 0.305, color: black}
  a2_yellow:       {class: buoy_yellow,     shape: sphere,    diameter: 0.368, height: 0.305, color: yellow}
  a2_blue:         {class: buoy_blue,       shape: sphere,    diameter: 0.368, height: 0.305, color: blue}
  a2_white:        {class: buoy_white,      shape: sphere,    diameter: 0.368, height: 0.305, color: white}

buoys:
  # --- Task 1: entry/exit gates, 8.7 m wide and 8.0 m apart as placed in Gazebo ---
  - {type: pole_red,   east: -2.28, north: 0.0}
  - {type: pole_green, east: 6.38,  north: 0.0}
  - {type: pole_red,   east: -2.28, north: 7.95}
  - {type: pole_green, east: 6.38,  north: 7.95}
  # --- Task 2: navigation channel, red on the port side going in; first gate where Baris
  #     placed the Task 2 entrance ---
  - {type: a0_red,     east: 2.32, north: 21.13}
  - {type: a0_green,   east: 4.82, north: 21.13}
  - {type: a0_red,     east: 2.92, north: 27.13}
  - {type: a0_green,   east: 5.42, north: 27.13}
  - {type: a0_red,     east: 3.52, north: 33.13}
  - {type: a0_green,   east: 6.02, north: 33.13}
  - {type: a0_black,   east: 4.12, north: 33.33}   # inside the gate, beside the red
  - {type: a0_red,     east: 4.52, north: 39.13}
  - {type: a0_green,   east: 7.02, north: 39.13}
  - {type: a0_black,   east: 5.12, north: 39.43}
  # --- Task 2: debris field ---
  - {type: a0_black,   east: 7.52,  north: 45.13}
  - {type: a0_black,   east: 12.52, north: 47.13}
  - {type: a0_black,   east: 16.52, north: 52.13}
  - {type: a0_black,   east: 20.52, north: 55.13}
  - {type: a0_black,   east: 9.52,  north: 54.13}
  - {type: indicator_green, east: 14.52, north: 49.13}   # survivor: circle 360 and report
  - {type: indicator_red,   east: 18.52, north: 58.13}   # hazard: avoid and report
  # --- 2027 Task 2 (Primer course layout) ---
  - {type: robobuoy_number, name: task2_buoy1, east: -90.51, north: 47.51, number: 1, indicator: red}
  - {type: robobuoy_number, name: task2_buoy2, east: -58.59, north: 35.51, number: 2, indicator: red}
  - {type: robobuoy_number, name: task2_buoy3, east: -99.15, north: 15.19, number: 3, indicator: green}
  - {type: a2_green,  name: task2_green,  east: -76.67, north: 50.87}
  - {type: a2_white,  name: task2_white,  east: -62.59, north: 46.63}
  - {type: a2_blue,   name: task2_blue,   east: -81.63, north: 34.15}
  - {type: a2_red,    name: task2_red,    east: -97.07, north: 29.83}
  - {type: a2_yellow, name: task2_yellow, east: -87.79, north: 20.39}
  - {type: a2_black,  name: task2_black,  east: -75.31, north: 22.47}
  # --- 2027 course markers at the corners (letters; the camera has no class for them) ---
  - {type: robobuoy_marker, name: marker_a, east: -142.35, north: 59.35, letter: A}
  - {type: robobuoy_marker, name: marker_b, east: -55.95,  north: 58.39, letter: B}
  - {type: robobuoy_marker, name: marker_c, east: -142.35, north: -10.09, letter: C}
  - {type: robobuoy_marker, name: marker_d, east: -55.95,  north: -10.09, letter: D}

# RoboBoat 2027 Task 1 (Safe Passage). layout: primer = the ten buoys of task1_primer, as
# drawn in the Primer; a number = a random field with that seed (usv_sim/task1_field.py),
# laid out from entry along heading_deg; level (random fields only): core | advanced (the
# EXIT moves) | disruptive (and colours swap). sim.launch.py layout:= and level:= override
# them. Random field size and spacing ASSUMED (no handbook gives them); 10 buoys as RobotX.
task1_field:
  layout: primer
  entry: {east: -138.27, north: 39.59}      # the Primer's ENTRY
  heading_deg: 90.0                         # towards its EXIT (east here)
  length_m: 30.0
  width_m: 22.0
  buoys: 10
  min_gap_m: 4.0
  level: core

# ---------------------------------------------------------------------------------------
# The 2027 competition course as drawn in the Primer's "Course layout" picture (1320 x 960
# px): the boat start (its bottom-left black boat, px 152, 783) is the competition start;
# picture up = north here (west in the park). The picture is not to scale: 0.08 m/px is
# ASSUMED (Task 1 buoys ~10 m apart, the course ~86 x 70 m). Elements keep their real size
# (the dock is 6.6 m long, drawn as ~32 m), centred where they are drawn.
# ---------------------------------------------------------------------------------------
# Task 1 as drawn: flashing blue = ENTRY (rays in the picture), solid blue = EXIT (none);
# red and green flash. Phases differ (ASSUMED: the beacons are not synchronised).
task1_primer:
  - {type: robobuoy, name: task1_entry, east: -138.27, north: 39.59, light: {color: blue, flash: true, phase_s: 0.3}}
  - {type: robobuoy, name: task1_exit,  east: -111.31, north: 29.43, light: {color: blue}}
  - {type: robobuoy, name: task1_green_a, east: -137.23, north: 47.35, light: {color: green, flash: true, phase_s: 1.1}}
  - {type: robobuoy, name: task1_off_a,   east: -123.71, north: 50.15, light: 'off'}
  - {type: robobuoy, name: task1_red_a,   east: -114.19, north: 46.79, light: {color: red, flash: true, phase_s: 0.7}}
  - {type: robobuoy, name: task1_red_b,   east: -127.47, north: 39.59, light: {color: red, flash: true, phase_s: 1.6}}
  - {type: robobuoy, name: task1_green_b, east: -109.15, north: 39.03, light: {color: green, flash: true, phase_s: 0.2}}
  - {type: robobuoy, name: task1_red_c,   east: -137.23, north: 29.19, light: {color: red, flash: true, phase_s: 1.3}}
  - {type: robobuoy, name: task1_green_c, east: -121.15, north: 31.03, light: {color: green, flash: true, phase_s: 0.9}}
  - {type: robobuoy, name: task1_off_b,   east: -128.11, north: 22.79, light: 'off'}

# Task 3 (Navigate the Marina): bays open west in the picture; bay 1 is the top one (north
# here), bay 3 holds a vessel (the orange one drawn in it), so it is red; bay 2 is free.
# Its window 2 lights red once the boat has been in the bay 3 s (usv_sim/marina.py).
marina:
  name: M
  east: -61.26              # middle of the deck's bay-side edge (deck centre px 1086, 712)
  north: 6.31
  heading_deg: 270.0        # the bays open to the west
  level: core               # core | disruptive (the two-colour sequence after the green)
  sequence: [red, blue]     # disruptive: first colour (red water / blue ball), second
  hold_s: 3.0
  bays:
    - {indicator: red}
    - {indicator: green, window: 2}
    - {indicator: red, vessel: yellow, shape: circle}

# Task 2 (Emergency Response Sprint): numbered RoboBuoys with a Color Indicator on top and
# Polyform buoys in six colours. The pinger is not simulated.
#
# Task 4 (Delivery Run): vessels (see `vessels`) with a 2027 shape (plus = cross, circle,
# square, triangle) on a white board standing on them like a sail.
#
# Task 5 (Dynamic Response): a zone, nothing in the water (for the mission, step 6).
zones:
  dynamic_response: {east: -116.03, north: 12.87, radius_m: 9.0}

vessels:
  - {color: black,  east: 6.52, north: 56.13, heading_deg: 30.0}  # in the debris field
  # 2027 Task 4 (Primer course layout; orange drawn = yellow here). Shapes ASSUMED (the
  # picture does not show them): one of each
  - {color: black,  east: -103.79, north: 52.07, heading_deg: 350.0, shape: plus}
  - {color: yellow, east: -70.99,  north: 55.83, heading_deg: 300.0, shape: circle}
  - {color: black,  east: -97.71,  north: 0.15,  heading_deg: 90.0,  shape: square}
  - {color: yellow, east: -115.07, north: -4.65, heading_deg: 60.0,  shape: triangle}

# Map-measurement route (phase 6 R1.6), driven by survey_drive from Gazebo's true pose, so
# every run takes the same path: through the Task 1 gates, one full turn on the spot (the
# heading filter's lag), the channel just right of its centre line, across the debris field,
# then back south along the east side of the channel to the start. About 130 m. Same
# coordinates as the buoys. (Until 2026-11-10 the route went on through the Task 3 gate and
# past the marina, about 155 m: numbers of older survey runs are not comparable.)
survey:
  - {east: 2.05, north: -1.0}
  - {east: 2.05, north: 11.0}
  - {spin_deg: 360}
  - {east: 3.6,  north: 18.0}
  - {east: 4.5,  north: 27.1}
  - {east: 5.1,  north: 33.1}
  - {east: 6.1,  north: 39.1}
  - {east: 5.5,  north: 45.5}
  - {east: 11.5, north: 52.0}
  - {east: 17.5, north: 49.5}
  - {east: 14.0, north: 40.0}
  - {east: 11.0, north: 25.0}
  - {east: 9.5,  north: 10.0}
  - {east: 8.0,  north: -3.0}
  - {east: 2.0,  north: -6.0}
