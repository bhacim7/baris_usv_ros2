# Course of the legacy run of 2026-10-14 (Golcuk), PROVISIONAL.
#
# Anchors read from the HUD video (exact as recorded):
#   origin       TASK2 start waypoint (HEDEF_KONUM, frame 0)
#   T2 mid/end   40.723589, 29.825499 (config has MID = END, so GO_TO_END ends at once)
#   T3 start     40.723576, 29.825515    T3 mid 40.723547, 29.825561
# Estimated (+/- 2 m), because the WhatsApp copy of the video is too small to read most ZED
# distance labels: the Task 2 corridor follows the TEKNOFEST course diagram (orange flagged
# boundary buoys, yellow obstacles inside) with spacings and side offsets taken from where
# the boat passed buoys in the video; the three Task 3 targets from single sightings.
# The ZED's depth is the distance along the optical axis, so a label of d metres at an angle
# a off the axis is a range of d / cos(a) (used for the green and black targets).
# Replace with final_costmap.npz from a real run when one is found.
#
# Generate the Gazebo world from this file:
#   python3 /ws/src/usv_sim/scripts/make_course_world.py \
#       /ws/src/usv_sim/courses/golcuk_2026_10_14.yaml /ws/src/usv_sim/worlds/golcuk_2026_10_14.sdf

name: golcuk_2026_10_14

# World (0, 0) is here. Gazebo turns positions into latitude/longitude from this point.
origin: {lat: 40.724038, lon: 29.825102}

# Earth's magnetic field at the site. fake_perception computes the ZED 2i magnetometer from
# it (Gazebo's own magnetometer gets the field wrong). Declination +6 deg is what the team
# uses in Istanbul (legacy camera_process); inclination and strength are rounded WMM values
# for the Izmit bay.
magnetic_field: {declination_deg: 6.0, inclination_deg: 56.5, strength_uT: 46.5}

# Where the boat starts: first HUD position (frame 0), pointing down the corridor
boat: {lat: 40.724066, lon: 29.825080, heading_deg: 146.0}

# What the navigator is given for this course (sim.launch.py overrides navigator.yaml with
# it; on the boat the same values come from the GCS). Waypoints [lat, lon] are the run's own
# (HUD): T2 entry = origin, T2 mid = end (as in that day's config), T3 start and mid. Task 1
# was not filmed: three invented gates 8 m apart at bearing 326 deg leading to the T2 entry,
# the same as the golden test scenarios (usv_core/test/golden/scenario.py).
# There is no drone in the simulation, so the configured colour is used and engaged early.
mission:
  start_task: TASK2_START
  task3_kamikaze_color: red
  drone_active: false
  waypoints:
    T1_GATE_ENTER: [40.7242172, 29.8249431]
    T1_GATE_MID: [40.7241574, 29.8249961]
    T1_GATE_EXIT: [40.7240977, 29.8250490]
    T2_ZONE_ENTRY: [40.724038, 29.825102]
    T2_ZONE_MID: [40.723589, 29.825499]
    T2_ZONE_END: [40.723589, 29.825499]
    T3_START: [40.723576, 29.825515]
    T3_MID: [40.723547, 29.825561]

# Shapes of each buoy type. Sizes from the TEKNOFEST specification:
#   boundary (orange, RAL 2003) and obstacle (yellow, RAL 1026): pear type, 30 cm wide,
#     50 cm tall without the flag
#   targets (RAL 3026 red, RAL 6037 green, RAL 9005 black): 200 L float, 640 mm wide,
#     950 mm tall
# height = above the water. ASSUMED: light floats, ~85-90 % of the body above the water.
buoy_types:
  orange_flag:  {class_id: 3, shape: pear,     diameter: 0.30, height: 0.43, flag: true}
  yellow_flag:  {class_id: 1, shape: pear,     diameter: 0.30, height: 0.43, flag: true}
  red_target:   {class_id: 0, shape: cylinder, diameter: 0.64, height: 0.85, flag: false}
  green_target: {class_id: 4, shape: cylinder, diameter: 0.64, height: 0.85, flag: false}
  black_target: {class_id: 2, shape: cylinder, diameter: 0.64, height: 0.85, flag: false}

buoys:
  # Task 2 corridor, 60.2 m from the origin at 146.2 deg; left boundary 3 m left of that line
  - {type: orange_flag, lat: 40.7240530, lon: 29.8251315}   # left,  0 m along
  - {type: orange_flag, lat: 40.7239858, lon: 29.8251909}   # left,  9 m
  - {type: orange_flag, lat: 40.7239187, lon: 29.8252503}   # left, 18 m
  - {type: orange_flag, lat: 40.7238552, lon: 29.8253064}   # left, 26.5 m
  - {type: orange_flag, lat: 40.7237918, lon: 29.8253625}   # left, 35 m
  - {type: orange_flag, lat: 40.7237246, lon: 29.8254219}   # left, 44 m
  - {type: orange_flag, lat: 40.7236649, lon: 29.8254747}   # left, 52 m
  - {type: orange_flag, lat: 40.7236052, lon: 29.8255274}   # left, 60 m
  # right boundary, 9 m right of the line
  - {type: orange_flag, lat: 40.7239631, lon: 29.8250398}   # right,  4 m
  - {type: orange_flag, lat: 40.7238960, lon: 29.8250992}   # right, 13 m
  - {type: orange_flag, lat: 40.7238288, lon: 29.8251585}   # right, 22 m
  - {type: orange_flag, lat: 40.7237617, lon: 29.8252179}   # right, 31 m
  - {type: orange_flag, lat: 40.7236945, lon: 29.8252773}   # right, 40 m
  - {type: orange_flag, lat: 40.7236273, lon: 29.8253367}   # right, 49 m
  - {type: orange_flag, lat: 40.7235602, lon: 29.8253961}   # right, 58 m
  # yellow obstacles inside, right of the line (the boat passed them on its right)
  - {type: yellow_flag, lat: 40.7239111, lon: 29.8251928}   # 16 m, 1.5 m right
  - {type: yellow_flag, lat: 40.7238574, lon: 29.8252360}   # 23 m, 1.8 m right
  - {type: yellow_flag, lat: 40.7238202, lon: 29.8252375}   # 26.5 m, 4.0 m right
  - {type: yellow_flag, lat: 40.7237892, lon: 29.8253148}   # 33 m, 0.5 m right (hit, frame ~950)
  - {type: yellow_flag, lat: 40.7237360, lon: 29.8253377}   # 39 m, 2.2 m right
  - {type: yellow_flag, lat: 40.7236722, lon: 29.8253612}   # 46 m, 4.5 m right
  - {type: yellow_flag, lat: 40.7236310, lon: 29.8254504}   # 54 m, 0.8 m right (hit, frame ~1500)
  # Task 3 targets
  - {type: red_target,   lat: 40.7234713, lon: 29.8256045}  # hit by the kamikaze, frame ~2046
  - {type: green_target, lat: 40.7234745, lon: 29.8255374}  # frame 1920: depth 4.3 m, 49 deg right
  - {type: black_target, lat: 40.7235116, lon: 29.8256511}  # frame 1812: depth 7.3 m, 29 deg left
