# Azure: the boat with the Jetson AGX Thor (RoboBoat 2027, docs/roboboat-2027.md section 6).
# A boat profile says what THIS boat has; what both boats share (hull, thrusters, Orange
# Cube, GPS, batteries) is not repeated here. Read with usv_core.boat.load; the name is the
# boat's ROS namespace (/azure/...) and `number` its number on the GCS link.
name: azure
number: 1
computer: jetson_agx_thor
cameras:
  - {name: nav, model: zed2i, mount: hull, depth: true}
lidar: false          # a 3D LiDAR goes on this boat if it arrives
water_cannon: false
# GCS link (usv_core.gcs_link): the Ubiquiti address (ASSUMED until the network is set
# up, docs/baris-yapacaklar.md) and the UDP port the boat listens on (the GCS on 15600)
ip: 192.168.1.11
udp_port: 15601
balls: 0
