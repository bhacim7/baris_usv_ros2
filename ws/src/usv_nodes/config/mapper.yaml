# mapper parameters (usv_core.world_map.MapConfig). First values, to be tuned from the
# map-quality report (ws/tools/run_report.py, phase 6 R1.6).
# '/**' = the mapper of any boat (/azure, /marine): the launch gives this file to it only
/**:
  ros__parameters:
    merge_radius_m: 1.5       # a sighting joins the nearest landmark of its kind within this
                              # (the dock indicators stand 2 m apart)
    max_range_m: 12.0         # farther sightings are not mapped (legacy MAP_MAX_RANGE_M)
    sigma_base_m: 0.3         # sighting uncertainty = base + per_m * range (ASSUMED)
    sigma_per_m: 0.1
    confirm_sightings: 3      # a landmark is trusted after this many sightings
    color_window: 15          # indicator colour = majority of the last N sightings
    beacon_window_s: 2.5      # light beacon colour = lit colours of the last N seconds
    # Clean-ups (phase 6 R1.7, usv_core/world_map.py); 0 = off
    heading_lag_s: 0.25       # D4: heading filter lag; a sighting taken while turning gets
                              # distance * tan(lag * yaw rate) more sigma (measured: mean
                              # 9 deg heading error above 30 deg/s)
    new_landmark_max_turn_dps: 20.0   # D4: turning faster, sightings start no landmark
    confusion_ratio: 5.0      # D5: not confirmed while another kind within the radius has
    confusion_radius_m: 1.5   # this many times its sightings and was seen with it in fewer
                              # than 2 frames (30 times, however often seen with it);
                              # 1.0 missed wrong labels 1.0-1.3 m off their buoy (t2e_s1)
    copy_merge_radius_m: 2.0  # D7 (R3.5): landmarks of a kind this close, not seen in 3
                              # frames together, are one buoy mapped twice (GPS drift):
                              # folded together. Maps rebuilt from bags: objects mapped
                              # twice t2d_s1 16 -> 0, t2c_s1 11 -> 0, survey1_d6 10 -> 0;
                              # the dock indicators 2 m apart stay two (world_map.py D7)
    publish_hz: 2.0
    map_file: ''              # JSON written on shutdown; '' = not saved
